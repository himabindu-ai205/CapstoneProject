name: Weekly Play Store

on:
  schedule:
    # 14:30 UTC Sunday is 22:30 Sunday on the +08:00 clock, covering Monday through that Sunday.
    - cron: "30 14 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Fetch the week, filter, and run the weekly steps
        run: python -m desk.schedule
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-desk
          path: |
            data/Playstore_*.csv
            data/desk.sqlite
      - name: Commit the weekly CSV
        run: |
          git config user.name "support-desk"
          git config user.email "support-desk@users.noreply.github.com"
          git add data/Playstore_*.csv
          git diff --cached --quiet || git commit -m "Add the Play Store week."
          git push
